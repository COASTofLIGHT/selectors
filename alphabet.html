<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alphabet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Atkinson+Hyperlegible:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #EDF3F2;
    --ink: #10303A;
    --ink-soft: #456670;
    --line: #5F808A;
    --line-soft: rgba(16, 48, 58, 0.14);
    --sea: #17677A;
    --sea-deep: #124F5E;
    --focus: #0B62A4;
    --panel: #F9FBFB;
    --teal: #A8D5CB;
    --sand: #F2D9A6;
    --coral: #F4B5A0;
    --lilac: #C9C3EA;
    --sky: #A9CCEB;
    --rose: #F0C2D3;
    --leaf: #C7DE9F;
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--mist);
    color: var(--ink);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button { font-family: var(--font); }

  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: clamp(1rem, 3vw, 2.25rem);
  }

  /* ---------- Title, tabs and the way back (as on the Word Lab pages) ---------- */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; column-gap: clamp(1rem, 2.5vw, 2rem); }
  .top h1 { margin: 0 0 0.6rem; font-size: clamp(1.4rem, 2.8vw, 2.1rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .back { margin: 0 0 0.75rem auto; color: var(--ink-soft); font-size: 0.9rem; text-decoration: none; white-space: nowrap; }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* The two tabs sit on top of the frame: Alphabet and Alphabet Rush */
  .tabs { display: flex; gap: 0.2rem; }
  .tabs button {
    display: flex; align-items: center;
    height: 2.75rem; padding: 0 1.15rem; border: 0; border-radius: 0.7rem 0.7rem 0 0;
    background: transparent; color: var(--ink-soft);
    font-size: 1rem; font-weight: 700; white-space: nowrap; cursor: pointer;
  }
  .tabs button:hover { background: rgba(255, 255, 255, 0.55); color: var(--ink); }
  .tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); }
  .tabs button:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }

  /* ---------- The frame everything sits on ---------- */
  .frame { background: var(--panel); border-radius: 0.9rem; padding: clamp(0.8rem, 2vw, 1.4rem); }
  .source { margin: 0; color: var(--ink-soft); font-size: 1rem; }

  /* Letters and Pool, shared by both tabs */
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.75rem; margin: 0.8rem 0 1.1rem; }
  .controls.locked { opacity: 0.45; pointer-events: none; }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 0.9rem; }
  .group-label { font-weight: 600; }
  .choices { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .choices label { position: relative; display: block; }
  .choices input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .choices span {
    display: grid; place-items: center;
    min-width: 2.75rem; height: 2.75rem; padding: 0 1rem;
    border: 2px solid var(--line); border-radius: 0.6rem;
    font-size: 1.1rem; font-weight: 700;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .choices input:not(:checked):hover + span { border-color: var(--ink); }
  .choices input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--mist); }
  .choices input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 3px; }

  .panel { display: flex; flex-direction: column; gap: 0.9rem; }

  /* ---------- The letter tile ---------- */
  .tile {
    width: 100%;
    height: clamp(11rem, calc(100vh - 25rem), 30rem);
    border-radius: 0.9rem;
    background: var(--sky); color: var(--ink);
    display: grid; place-items: center;
    transition: background-color 120ms linear;
    overflow: hidden; user-select: none;
  }
  @supports (height: 100svh) {
    .tile { height: clamp(11rem, calc(100svh - 25rem), 30rem); }
  }
  .tile.idle { background: var(--mist); color: var(--ink-soft); border: 3px dashed var(--line-soft); }
  .tile.stopped { box-shadow: inset 0 0 0 10px var(--ink); }
  /* On the Alphabet tab the tile itself is the button */
  button.tile { border: 0; padding: 0; cursor: pointer; }
  button.tile.idle { border: 3px dashed var(--line-soft); }
  button.tile:hover { filter: brightness(0.97); }
  .tile:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

  .letter {
    font-family: "Atkinson Hyperlegible", var(--font);
    font-weight: 700;
    font-size: min(26vh, 40vw, 18rem);
    line-height: 1;
  }
  .letter.pop { animation: pop 160ms ease-out; }
  @keyframes pop { from { transform: scale(0.82); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
  .idle .letter { font-family: var(--font); font-size: clamp(1.3rem, 4vw, 2rem); text-align: center; padding: 0 1.5rem; }

  .timer { height: 0.6rem; border-radius: 999px; background: var(--line-soft); overflow: hidden; }
  .timer span { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 999px; }

  /* ---------- Buttons ---------- */
  .buttons { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .btn {
    flex: 1 1 10rem;
    height: 3.25rem; padding: 0 1.6rem;
    border: 0; border-radius: 0.6rem;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
  }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .primary { background: var(--sea); color: #fff; }
  .primary:hover:not(:disabled) { background: var(--sea-deep); }
  .stop { background: var(--coral); color: var(--ink); }
  .stop:hover:not(:disabled) { filter: brightness(0.95); }

  /* ---------- Alphabet Rush scores ---------- */
  .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
  .score { background: var(--mist); border-radius: 0.6rem; padding: 0.4rem 0.9rem; }
  .score b { display: block; font-size: 1.5rem; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .score small { color: var(--ink-soft); font-size: 0.9rem; }

  .hint { margin: 1.1rem 0 0; color: var(--ink-soft); font-size: 0.95rem; }

  @media (max-width: 640px) {
    .tabs { order: 3; flex-basis: 100%; }
    .tabs button { padding: 0 0.9rem; }
    .tile { height: clamp(10rem, 38vh, 22rem); }
    .score b { font-size: 1.25rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .letter.pop { animation: none; }
    .tile, .choices span { transition: none; }
  }
</style>
</head>
<body>
<main class="page">
  <div class="top">
    <h1>Alphabet</h1>
    <div class="tabs" role="tablist" aria-label="Alphabet games" id="tabs">
      <button type="button" role="tab" id="tab-letter" data-mode="letter" aria-controls="letter-panel" aria-selected="true">Alphabet</button>
      <button type="button" role="tab" id="tab-rush" data-mode="rush" aria-controls="rush-panel" aria-selected="false" tabindex="-1">Alphabet Rush</button>
    </div>
    <a class="back" href="./">&larr; Selectors</a>
  </div>

  <div class="frame">
    <p class="source" id="source">Tap the tile for a random letter.</p>

    <!-- These choices are used by both tabs -->
    <div class="controls" id="options">
      <div class="group" role="radiogroup" aria-labelledby="case-label">
        <span class="group-label" id="case-label">Letters</span>
        <div class="choices">
          <label><input type="radio" name="case" value="upper" checked><span>ABC</span></label>
          <label><input type="radio" name="case" value="lower"><span>abc</span></label>
          <label><input type="radio" name="case" value="mixed"><span>Mixed</span></label>
        </div>
      </div>
      <div class="group" role="radiogroup" aria-labelledby="pool-label">
        <span class="group-label" id="pool-label">Pool</span>
        <div class="choices">
          <label><input type="radio" name="pool" value="all" checked><span>All 26</span></label>
          <label><input type="radio" name="pool" value="tricky"><span>Tricky letters</span></label>
        </div>
      </div>
    </div>

    <!-- Tab 1, Alphabet: one random letter each time you tap -->
    <section class="panel" id="letter-panel" role="tabpanel" aria-labelledby="tab-letter">
      <button type="button" class="tile idle" id="pickTile" aria-label="Show a random letter">
        <span class="letter" id="pickLetter" aria-live="polite">Tap for a letter</span>
      </button>
      <div class="buttons">
        <button class="btn primary" id="newBtn" type="button">New letter</button>
      </div>
    </section>

    <!-- Tab 2, Alphabet Rush: the letters come faster and faster -->
    <section class="panel" id="rush-panel" role="tabpanel" aria-labelledby="tab-rush" hidden>
      <div>
        <div class="tile idle" id="tile" aria-live="off">
          <div class="letter" id="letter">Press Start</div>
        </div>
        <div class="timer" aria-hidden="true" style="margin-top: 0.6rem"><span id="bar"></span></div>
      </div>
      <div class="buttons">
        <button class="btn primary" id="startBtn" type="button">Start</button>
        <button class="btn stop" id="stopBtn" type="button" disabled>Stop</button>
      </div>
      <div class="scores">
        <div class="score"><b id="count">0</b><small>letters this round</small></div>
        <div class="score"><b id="best">0</b><small>best round</small></div>
        <div class="score"><b id="speed">2.0s</b><small>per letter</small></div>
      </div>
    </section>

    <p class="hint">Tricky letters: A E I G J H K Q U V B W Y R.<span id="rushNote" hidden> Starts at 2 seconds and gets a little faster with every letter.</span></p>
  </div>
</main>

<script>
(function () {
  /* ---------------------------------------------------------------
     Two tabs on one page.
       Alphabet:      tap for one random letter at a time.
       Alphabet Rush: the letters change by themselves, faster and
                      faster, until someone presses Stop.
     A link can open a tab directly: ?mode=letter or ?mode=rush.
     Otherwise the page opens on the last one used.
  ---------------------------------------------------------------- */

  const ALL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const TRICKY = "AEIGJHKQUVBWYR".split("");
  const COLOURS = ["--teal", "--sand", "--coral", "--lilac", "--sky", "--rose", "--leaf"];
  const HINTS = {
    letter: "Tap the tile for a random letter.",
    rush: "Say each letter before the next one. Stop when you say a letter incorrectly."
  };

  const $ = id => document.getElementById(id);
  const options = $("options");
  const val = name => document.querySelector(`input[name="${name}"]:checked`).value;
  const letters = () => val("pool") === "tricky" ? TRICKY : ALL;

  /* ABC, abc or a mix of the two */
  function inCase(l) {
    const mode = val("case");
    if (mode === "lower") return l.toLowerCase();
    if (mode === "mixed" && Math.random() < 0.5) return l.toLowerCase();
    return l;
  }

  let lastColour = null;
  function pickColour() {
    let c;
    do { c = COLOURS[Math.floor(Math.random() * COLOURS.length)]; } while (c === lastColour);
    lastColour = c;
    return c;
  }

  function pop(el) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }

  /* ===============================================================
     Tab 1: Alphabet
     Every letter in the pool comes up once before any comes again.
  ================================================================ */

  const pickTile = $("pickTile"), pickLetter = $("pickLetter");
  let pile = [], lastPicked = null;

  function newLetter() {
    if (!pile.length) {
      pile = letters().slice();
      for (let i = pile.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pile[i], pile[j]] = [pile[j], pile[i]];
      }
      if (pile.length > 1 && pile[pile.length - 1] === lastPicked) pile.unshift(pile.pop());
    }
    lastPicked = pile.pop();
    pickTile.classList.remove("idle");
    pickTile.style.background = `var(${pickColour()})`;
    pickLetter.textContent = inCase(lastPicked);
    pop(pickLetter);
  }

  pickTile.addEventListener("click", newLetter);
  $("newBtn").addEventListener("click", newLetter);
  /* Changing the pool starts a fresh set of letters */
  document.querySelectorAll('input[name="pool"]').forEach(r => r.addEventListener("change", () => { pile = []; }));

  /* ===============================================================
     Tab 2: Alphabet Rush
  ================================================================ */

  const START_MS = 2000;   // first letter
  const FACTOR = 0.96;     // each letter is 4% faster
  const MIN_MS = 600;      // fastest it gets

  const tile = $("tile"), letterEl = $("letter"), bar = $("bar");
  const startBtn = $("startBtn"), stopBtn = $("stopBtn");
  const countEl = $("count"), bestEl = $("best"), speedEl = $("speed");

  let running = false, timer = null, interval = START_MS, count = 0, best = 0;
  let lastLetter = null;

  try { best = parseInt(localStorage.getItem("alphabetRushBest") || "0", 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  function pickLetterForRush() {
    const pool = letters();
    let l;
    do { l = pool[Math.floor(Math.random() * pool.length)]; } while (l === lastLetter && pool.length > 1);
    lastLetter = l;
    return inCase(l);
  }

  function runBar(ms) {
    bar.style.transition = "none";
    bar.style.width = "100%";
    void bar.offsetWidth;
    bar.style.transition = `width ${ms}ms linear`;
    bar.style.width = "0%";
  }

  function showLetter() {
    tile.style.background = `var(${pickColour()})`;
    letterEl.textContent = pickLetterForRush();
    pop(letterEl);
    speedEl.textContent = (interval / 1000).toFixed(1) + "s";
    runBar(interval);
    timer = setTimeout(next, interval);
  }

  function next() {
    count++;
    countEl.textContent = count;
    interval = Math.max(MIN_MS, Math.round(interval * FACTOR));
    showLetter();
  }

  function start() {
    if (running) return;
    running = true;
    count = 0; interval = START_MS; lastLetter = null;
    countEl.textContent = 0;
    tile.classList.remove("idle", "stopped");
    options.classList.add("locked");
    startBtn.disabled = true; stopBtn.disabled = false;
    stopBtn.focus();
    showLetter();
  }

  function stop() {
    if (!running) return;
    running = false;
    clearTimeout(timer);
    const w = getComputedStyle(bar).width;
    bar.style.transition = "none"; bar.style.width = w;
    tile.classList.add("stopped");
    if (count > best) {
      best = count; bestEl.textContent = best;
      try { localStorage.setItem("alphabetRushBest", String(best)); } catch (e) {}
    }
    options.classList.remove("locked");
    startBtn.disabled = false; stopBtn.disabled = true;
    startBtn.textContent = "Start again";
    startBtn.focus();
  }

  startBtn.addEventListener("click", start);
  stopBtn.addEventListener("click", stop);
  bestEl.parentElement.addEventListener("dblclick", () => {
    best = 0; bestEl.textContent = 0;
    try { localStorage.removeItem("alphabetRushBest"); } catch (e) {}
  });

  /* ===============================================================
     The tabs
  ================================================================ */

  const tabs = [...document.querySelectorAll("#tabs [role=tab]")];
  let mode = "letter";

  function chooseMode(next, remember) {
    if (running && next !== "rush") stop();     // leaving the game ends the round
    mode = next;
    tabs.forEach(t => {
      const on = t.dataset.mode === mode;
      t.setAttribute("aria-selected", on);
      t.tabIndex = on ? 0 : -1;
    });
    $("letter-panel").hidden = mode !== "letter";
    $("rush-panel").hidden = mode !== "rush";
    $("rushNote").hidden = mode !== "rush";
    $("source").textContent = HINTS[mode];
    document.title = mode === "rush" ? "Alphabet Rush" : "Alphabet";
    if (remember) { try { localStorage.setItem("alphabet.mode", mode); } catch (e) {} }
  }
  tabs.forEach((t, i) => {
    t.addEventListener("click", () => chooseMode(t.dataset.mode, true));
    t.addEventListener("keydown", e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const to = tabs[(i + 1) % tabs.length];
      chooseMode(to.dataset.mode, true);
      to.focus();
    });
  });

  /* Space: a new letter on Alphabet, Start or Stop on Alphabet Rush */
  document.addEventListener("keydown", e => {
    if (e.code !== "Space") return;
    /* Space still works straight after choosing ABC, abc, All 26 and so on */
    if (e.target instanceof HTMLInputElement && e.target.type !== "radio") return;
    if (e.target.closest && e.target.closest("#tabs")) return;
    e.preventDefault();
    if (mode === "letter") newLetter();
    else running ? stop() : start();
  });

  /* Open on the tab in the link, or the last one used. */
  let startMode = "letter";
  try {
    const saved = localStorage.getItem("alphabet.mode");
    if (saved === "letter" || saved === "rush") startMode = saved;
  } catch (e) {}
  const asked = new URLSearchParams(location.search).get("mode");
  if (asked === "letter" || asked === "rush") startMode = asked;
  chooseMode(startMode, false);
})();
</script>
</body>
</html>
